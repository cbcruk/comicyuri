<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14141a" />
    <link href="/src/styles.css" rel="stylesheet" />
    <title>comicyuri · web comic viewer</title>
    <!--
      저장된 테마를 첫 페인트 전에 세운다(`S-144`). 앱이 시작해 테마를 걸기 전에
      라이트 테마인 사람이 어두운 화면을 한 번 보고 마는 일이 없도록, 읽은 값을 믿지
      않고 아는 값일 때만 건다.
    -->
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('comicyuri:settings'))
        var theme = stored && stored.theme
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#f4f2f7' : '#14141a')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
