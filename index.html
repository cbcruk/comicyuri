<!doctype html>
<html lang="en" data-theme="dark" data-astryx-theme="neutral">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b1b" />
    <link href="/src/styles.css" rel="stylesheet" />
    <title>comicyuri · web comic viewer</title>
    <!--
      저장된 테마를 첫 페인트 전에 세운다(`S-144`). 앱이 시작해 테마를 걸기 전에
      라이트 테마인 사람이 어두운 화면을 한 번 보고 마는 일이 없도록, 읽은 값을 믿지
      않고 아는 값일 때만 건다.

      `data-astryx-theme`은 `<html>`과 `<body>` 태그에 박아 둔다. 중립 테마의 토큰은 `@scope`로
      그 속성 아래에서만 서므로, 앱이 `Theme`를 세우기 전에는 바탕색조차 없다.

      `<body>`에도 두는 까닭은 `vite.stylex.ts`의 `LAYER_ORDER`에 적어 두었다 — `<html>`에서는
      레이어 밖에 떨어진 Astryx 코어 기본 토큰이 테마를 누른다.
    -->
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('comicyuri:settings'))
        var theme = stored && stored.theme
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#f1f1f1' : '#1b1b1b')
        }
      } catch {}
    </script>
  </head>
  <body data-astryx-theme="neutral">
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
